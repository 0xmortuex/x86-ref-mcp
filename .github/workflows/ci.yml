name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Extra Python versions run on ubuntu only - there's no OS-specific
        # Python code, so the full cross product would just burn minutes.
        exclude:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "ruff==0.16.0" "mypy==2.3.0" ".[test]"
      - run: ruff check src tests tools
      - run: mypy --strict src
      - run: pytest tests -v

  data-reproducible:
    # Rebuild the dataset from Intel XED at the pinned commits and require a
    # byte-identical result: the shipped data is exactly what XED says.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cp src/x86_ref_mcp/data/xed-insns.json.gz "$RUNNER_TEMP/committed.json.gz"
      - run: python tools/build_data.py
      - name: committed dataset matches a fresh build
        # Compare the decompressed data, not the .gz bytes: deflate output
        # can differ between zlib builds (Windows vs Linux) for identical input.
        run: |
          python - <<'PY'
          import gzip, os, sys
          a = gzip.decompress(open(os.path.join(os.environ["RUNNER_TEMP"], "committed.json.gz"), "rb").read())
          b = gzip.decompress(open("src/x86_ref_mcp/data/xed-insns.json.gz", "rb").read())
          print(f"committed {len(a)} bytes, rebuilt {len(b)} bytes")
          sys.exit(0 if a == b else "dataset differs from a fresh XED build")
          PY
