[project]
name = "x86-ref-mcp"
version = "0.1.0"
description = "MCP server that answers x86 questions agents usually get wrong: flags read/written, CPUID features, privilege, exceptions, CR/MSR bits - from Intel XED's ISA database."
readme = "README.md"
license = { text = "MIT AND Apache-2.0" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.0.0", "capstone>=5.0"]
keywords = ["mcp", "x86", "x86-64", "assembly", "isa", "xed", "osdev", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Assemblers",
    "Topic :: Software Development :: Disassemblers",
]

[project.optional-dependencies]
test = ["pytest>=7", "anyio"]

[project.urls]
Homepage = "https://github.com/0xmortuex/x86-ref-mcp"

[project.scripts]
x86-ref-mcp = "x86_ref_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x86_ref_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.mypy.overrides]]
# capstone ships no type stubs or py.typed marker.
module = ["capstone"]
ignore_missing_imports = true
